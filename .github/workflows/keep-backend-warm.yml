# The lead API sleeps when idle and costs about thirty seconds to boot, which
# is the difference between a contact form that answers and one a visitor
# assumes is broken. The app already wakes it when a page carrying the form
# renders, but that only helps once somebody is on the site — the first
# visitor of the day would still pay the boot. This covers that one.
#
# Daytime only, on purpose: the free tier allows 750 instance-hours a month
# against roughly 730 hours in a month, so holding the service up around the
# clock would spend essentially the whole allowance and leave nothing for
# anything else on the account. Fourteen hours a day is about 426.
#
# To stop this, disable the workflow in Actions, or delete this file. Nothing
# else depends on it: without it the form still works, just slowly for whoever
# arrives first.
name: Keep the lead API warm

on:
  schedule:
    # Every 10 minutes, 02:00–16:00 UTC — 08:00–22:00 in Asia/Dhaka. The
    # instance sleeps after 15 idle minutes, so ten is inside the margin.
    - cron: "*/10 2-16 * * *"
  workflow_dispatch:

# A late run is worth nothing once the next one is due.
concurrency:
  group: keep-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No secret here: this origin is already the public default the app
      # falls back to, and /health reads nothing.
      - name: Wake the API
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-all-errors \
            https://project-help-backend.onrender.com/health)
          echo "health -> $code"
          # A cold boot can outlast the request; the wake still landed, so a
          # bad status is worth printing but not worth failing the run over.
          [ "$code" = "200" ] || echo "::warning::health answered $code"
